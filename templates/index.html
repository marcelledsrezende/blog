<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{blog}}</title>
<meta name="description" content="{{tagline}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-head">
  <div class="wrap">
    <a class="brand" href="./">IBM <span>por</span> Marcelle Rezende</a>
    <nav>Produtos da IBM</nav>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Produtos da IBM, explicados sem rodeios.</h1>
    <p>{{tagline}}</p>
    <div class="count">{{total}} post(s)</div>
  </section>
  {{lista}}
</main>

<footer class="site-foot">
  <div class="wrap">© {{ano}} {{autor}}. Conteúdo pessoal, sem vínculo oficial com a IBM.</div>
</footer>
</body>
</html>
