<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{titulo}} — {{blog}}</title>
  <meta name="description" content="{{resumo}}" />
  <link rel="stylesheet" href="../assets/style.css" />
  <link rel="icon" type="image/png" href="../assets/images/logo2.png" />
</head>
<body>
<canvas id="bg-canvas"></canvas>
<nav>
  <a href="../index.html" class="logo">
    <img src="../assets/images/logo.png" alt="Logo" style="height:34px; width:auto;" />
    por Marcelle Rezende
  </a>
  <ul class="nav-links" id="mobileMenu">
    <li><a href="../index.html">HOME</a></li>
    <li><a href="../index.html#conteudos">POSTS</a></li>
    <li><a href="{{site_original}}/resumos.html">RESUMOS</a></li>
    <li><a href="{{site_original}}/certificacoes.html">CERTIFICAÇÕES</a></li>
    <li><a href="{{site_original}}/sobre.html">SOBRE MIM</a></li>
    <li><a href="{{site_original}}/galeria.html">GALERIA</a></li>
  </ul>
  <div class="nav-actions" style="display:flex; align-items:center; gap:1rem;">
    <button id="langToggleBtn" onclick="toggleLanguage()" style="background:none; border:none; font-size:24px; cursor:pointer; padding:0; line-height:1; transition:0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'" title="Mudar Idioma">🇺🇸</button>
    <button class="hamburger" onclick="toggleMobileMenu()">☰</button>
  </div>
</nav>
<div class="container" style="padding-top:2.5rem; padding-bottom:4rem; position:relative; z-index:5;">
  <a href="../index.html#conteudos" class="back-link">← Voltar para Posts</a>
  <div class="post-page-card">
    <div class="post-page-author-row">
      <img src="../assets/images/perfil.jpeg" class="user-avatar" style="width:44px;height:44px" alt="{{autor}}" />
      <div>
        <div class="post-author">{{autor}}</div>
        <div class="post-title-job">Administradora</div>
      </div>
      <div class="post-time">{{data_txt}}</div>
    </div>
    <h1 class="post-page-title">{{titulo}}</h1>
    <div class="post-page-content">
{{conteudo}}
    </div>
  </div>
</div>
<script src="../assets/js/site.js"></script>
</body>
</html>
