<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{titulo}} · {{blog}}</title>
<meta name="description" content="{{resumo}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<header class="site-head">
  <div class="wrap">
    <a class="brand" href="../">IBM <span>por</span> Marcelle Rezende</a>
    <nav>Produtos da IBM</nav>
  </div>
</header>

<main class="wrap">
  <article>
    <header class="post-head">
      <a class="back" href="../">← Todos os posts</a>
      <h1>{{titulo}}</h1>
      <p class="lede">{{resumo}}</p>
      <div class="post-meta">
        <span class="tag">{{produto}}</span>
        <span>{{autor}}</span>
        <time datetime="{{data}}">{{data_txt}}</time>
        <span>{{leitura}} min de leitura</span>
      </div>
    </header>
    <div class="prose">
{{conteudo}}
    </div>
  </article>
</main>

<footer class="site-foot">
  <div class="wrap"><a href="../">← Voltar para todos os posts</a></div>
</footer>
</body>
</html>
